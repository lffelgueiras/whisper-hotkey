name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: windows-2022
          - os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Fetch llama.cpp runtime (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/fetch-llama-runtime.sh
      - name: Fetch llama.cpp runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh scripts/fetch-llama-runtime.ps1
      # macOS code signing is disabled. To re-enable, restore the env block
      # below with APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
      # APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
      # from repo secrets (see src-tauri/README.dev.md). Unsigned .dmg
      # requires right-click -> Open on first launch.
      - name: Build (macOS, unsigned)
        if: runner.os == 'macOS'
        run: pnpm tauri build
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pnpm tauri build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
